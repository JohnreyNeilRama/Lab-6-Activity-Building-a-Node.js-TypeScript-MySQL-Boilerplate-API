openapi: 3.0.0
info:
  title: Node.js Sign-up and Verification API
  description: 'Node.js + MySQL - API with email sign-up, verification, authentication and forgot password'
  version: 1.0.0
servers:
  - url: https://lab-6-activity-building-a-node-js-tu44.onrender.com
    description: Production server (Render)
  - url: http://localhost:4000
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /accounts/authenticate:
    post:
      summary: Authenticate account credentials and return a JWT token and a cookie with a refresh token
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: jason.watmore@example.com
                password:
                  type: string
                  example: pass-123
      responses:
        '200':
          description: Authentication successful
        '400':
          description: Email or password is incorrect

  /accounts/refresh-token:
    post:
      summary: Use a refresh token to generate a new JWT token and a new refresh token
      tags: [Accounts]
      responses:
        '200':
          description: Token refreshed successfully

  /accounts/revoke-token:
    post:
      summary: Revoke a refresh token
      tags: [Accounts]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token revoked successfully

  /accounts/register:
    post:
      summary: Register a new user account and send a verification email
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, firstName, lastName, email, password, confirmPassword, acceptTerms]
              properties:
                title:
                  type: string
                  example: Mr
                firstName:
                  type: string
                  example: Jason
                lastName:
                  type: string
                  example: Watmore
                email:
                  type: string
                  example: jason.watmore@example.com
                password:
                  type: string
                  example: pass-123
                confirmPassword:
                  type: string
                  example: pass-123
                acceptTerms:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Registration successful, please check your email for verification instructions

  /accounts/verify-email:
    post:
      summary: Verify a new account with a verification token received by email after registration
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Verification successful, you can now login

  /accounts/forgot-password:
    post:
      summary: Submit email address to reset the password on an account
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: jason.watmore@example.com
      responses:
        '200':
          description: Please check your email for password reset instructions

  /accounts/validate-reset-token:
    post:
      summary: Validate the reset password token received by email after submitting to the forgot password endpoint
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token is valid
        '400':
          description: Token is invalid or expired

  /accounts/reset-password:
    post:
      summary: Reset the password for an account
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, confirmPassword]
              properties:
                token:
                  type: string
                password:
                  type: string
                  example: newPass-123
                confirmPassword:
                  type: string
                  example: newPass-123
      responses:
        '200':
          description: Password reset successful, you can now login

  /accounts:
    get:
      summary: Get a list of all accounts (admin only)
      tags: [Accounts]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of all accounts
    post:
      summary: Create a new account (admin only)
      tags: [Accounts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, firstName, lastName, email, password, confirmPassword, role]
              properties:
                title:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                confirmPassword:
                  type: string
                role:
                  type: string
                  enum: [Admin, User]
      responses:
        '200':
          description: Account created successfully

  /accounts/{id}:
    get:
      summary: Get a single account by id
      tags: [Accounts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Account details
    put:
      summary: Update an account
      tags: [Accounts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                confirmPassword:
                  type: string
                role:
                  type: string
                  enum: [Admin, User]
      responses:
        '200':
          description: Account updated successfully
    delete:
      summary: Delete an account
      tags: [Accounts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Account deleted successfully
